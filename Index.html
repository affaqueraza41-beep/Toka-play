<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toka Play - Loading...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0B0C10; font-family: sans-serif; }
        .fox-container { animation: foxFloat 2.2s infinite ease-in-out; }
        @keyframes foxFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen text-slate-200">
    <!-- Fox Logo -->
    <div class="w-28 h-24 bg-gradient-to-tr from-[#7C3AED] to-[#EC4899] rounded-[2.2rem] flex flex-col items-center justify-center mb-6 fox-container">
        <div class="flex gap-4 mb-2"><div class="w-3 h-3 bg-[#121420] rounded-full"></div><div class="w-3 h-3 bg-[#121420] rounded-full"></div></div>
        <div class="w-4 h-2 bg-[#121420] rounded-b-full"></div>
    </div>
    <h1 class="text-4xl font-black text-white uppercase">Toka<span class="text-[#EC4899]">Play</span></h1>
    <div class="w-48 h-1.5 bg-white/10 mt-6 rounded-full overflow-hidden">
        <div id="loading-progress" class="h-full bg-gradient-to-r from-[#7C3AED] to-[#EC4899] w-0 transition-all duration-[2500ms]"></div>
    </div>
    <script>
        window.onload = () => {
            setTimeout(() => { document.getElementById("loading-progress").style.width = "100%"; }, 100);
            setTimeout(() => { window.location.href = "register.html"; }, 3000);
        }
    </script>
</body>
</html>
