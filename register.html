<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #0B0C10; color: #fff; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-sm bg-[#121420] p-6 rounded-3xl border border-white/10">
        <h2 class="text-center font-bold mb-6">Create Toka ID</h2>
        <input id="nick" placeholder="Nickname" class="w-full p-3 mb-4 bg-[#1C1F32] rounded-xl outline-none">
        
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="setGender('Male')" class="p-3 bg-[#1C1F32] rounded-xl">♂️ Male</button>
            <button onclick="setGender('Female')" class="p-3 bg-[#1C1F32] rounded-xl">♀️ Female</button>
        </div>

        <select id="region" class="w-full p-3 mb-4 bg-[#1C1F32] rounded-xl">
            <option value="US">🇺🇸 USA</option><option value="IN">🇮🇳 India</option>
            <option value="UK">🇬🇧 UK</option><option value="PK">🇵🇰 Pakistan</option>
            <option value="AE">🇦🇪 UAE</option><option value="Global">🌍 Global</option>
        </select>

        <input type="number" id="age" placeholder="Your Age" class="w-full p-3 mb-6 bg-[#1C1F32] rounded-xl outline-none">
        <button onclick="register()" class="w-full py-4 bg-gradient-to-r from-[#7C3AED] to-[#EC4899] rounded-xl font-bold">Create Account</button>
    </div>
    <script>
        let gender = "";
        function setGender(g) { gender = g; }
        function register() { window.location.href = "home.html"; }
    </script>
</body>
</html>
