<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #0B0C10; color: #fff; font-family: sans-serif; }</style>
</head>
<body class="flex items-center justify-center h-screen p-4">
    <div class="w-full max-w-sm bg-[#121420] p-6 rounded-3xl border border-white/5">
        <h2 class="text-xl font-bold text-center mb-6">Create <span class="text-[#EC4899]">Toka ID</span></h2>
        <input id="nick" placeholder="Nickname" class="w-full p-3 mb-4 bg-[#1C1F32] rounded-xl outline-none border border-white/10 text-white">
        <button onclick="register()" class="w-full py-4 bg-gradient-to-r from-[#7C3AED] to-[#EC4899] rounded-xl font-bold uppercase tracking-wider transition-all active:scale-95">START GAME</button>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
