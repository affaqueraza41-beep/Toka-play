<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #0B0C10; color: #fff; font-family: sans-serif; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-[#121420] p-6 rounded-[2rem] border border-white/5">
        <h2 class="text-2xl font-bold text-center mb-6">Create <span class="text-[#EC4899]">Toka ID</span></h2>
        
        <div class="space-y-4">
            <input id="nickname" placeholder="Nickname" class="w-full p-3 bg-[#1C1F32] rounded-xl outline-none">
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="setGender('boy')" id="btn-boy" class="p-3 bg-[#1C1F32] rounded-xl font-bold">BOY</button>
                <button onclick="setGender('girl')" id="btn-girl" class="p-3 bg-[#1C1F32] rounded-xl font-bold">GIRL</button>
            </div>
            
            <select id="region" class="w-full p-3 bg-[#1C1F32] rounded-xl outline-none">
                <option value="India">🇮🇳 India</option>
                <option value="Global">🌍 Global</option>
            </select>
            
            <input type="date" id="dob" class="w-full p-3 bg-[#1C1F32] rounded-xl">
            
            <button onclick="completeRegistration()" class="w-full py-4 bg-gradient-to-r from-[#7C3AED] to-[#EC4899] rounded-xl font-bold">Create Account</button>
        </div>
    </div>
    <script>
        let gender = "";
        function setGender(g) { gender = g; alert("Selected: " + g); }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
