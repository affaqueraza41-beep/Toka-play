<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokaPlay</title><script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0B0C10; font-family: sans-serif; }
        .fox-face { 
            width: 120px; height: 120px; 
            background: linear-gradient(135deg, #7C3AED, #EC4899); 
            border-radius: 35px; position: relative;
        }
        .ear { 
            position: absolute; top: -20px; width: 30px; height: 40px; 
            background: #EC4899; border-radius: 12px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen">
    <!-- Updated Fox Logo -->
    <div class="fox-face flex flex-col items-center justify-center mb-8 relative">
        <div class="ear -left-1 rotate-[-15deg]"></div>
        <div class="ear right-0 rotate-[15deg]"></div>
        <div class="flex gap-4 mb-2"><div class="w-3 h-3 bg-[#0B0C10] rounded-full"></div><div class="w-3 h-3 bg-[#0B0C10] rounded-full"></div></div>
        <div class="w-6 h-3 bg-[#0B0C10] rounded-b-full flex justify-center items-end pb-1">
            <div class="w-1 h-1 bg-white rounded-full"></div>
        </div>
    </div>

    <h1 class="text-4xl font-black text-white tracking-tighter">TOKA<span class="text-[#EC4899]">PLAY</span></h1>
    <div class="w-48 h-1.5 bg-white/10 mt-6 rounded-full overflow-hidden">
        <div id="bar" class="h-full bg-gradient-to-r from-[#7C3AED] to-[#EC4899] w-0 transition-all duration-[2000ms]"></div>
    </div>
    <script>
        setTimeout(() => { document.getElementById('bar').style.width = '100%'; }, 100);
        setTimeout(() => { window.location.href = "register.html"; }, 2500);
    </script>
</body>
</html>
