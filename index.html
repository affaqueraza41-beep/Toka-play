<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokaPlay</title><script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0B0C10; }
        .fox-logo { position: relative; width: 100px; height: 100px; background: linear-gradient(to tr, #7C3AED, #EC4899); border-radius: 25px; }
        .ear { position: absolute; top: -15px; width: 30px; height: 40px; background: #EC4899; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen">
    <div class="fox-logo flex items-center justify-center">
        <div class="ear left-2 -rotate-12"></div><div class="ear right-2 rotate-12"></div>
        <div class="flex gap-3"><div class="w-3 h-3 bg-black rounded-full"></div><div class="w-3 h-3 bg-black rounded-full"></div></div>
    </div>
    <h1 class="text-3xl font-black text-white mt-8 tracking-tighter">TOKA<span class="text-[#EC4899]">PLAY</span></h1>
    <div class="w-48 h-1.5 bg-white/10 mt-6 rounded-full overflow-hidden">
        <div id="bar" class="h-full bg-[#EC4899] w-0 transition-all duration-[2000ms]"></div>
    </div>
    <script>
        setTimeout(() => { document.getElementById('bar').style.width = '100%'; }, 100);
        setTimeout(() => { window.location.href = "register.html"; }, 2500);
    </script>
</body>
</html>
