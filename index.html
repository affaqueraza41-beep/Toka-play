<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toka Play - Loading...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #0B0C10; }
        @keyframes foxFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.03); } }
        @keyframes earTwitchLeft { 0%, 90%, 100% { transform: rotate(35deg); } 95% { transform: rotate(25deg); } }
        @keyframes earTwitchRight { 0%, 90%, 100% { transform: rotate(-35deg); } 95% { transform: rotate(-25deg); } }
        .fox-container { animation: foxFloat 2.2s infinite ease-in-out; }
        .ear-l { animation: earTwitchLeft 3s infinite ease-in-out; }
        .ear-r { animation: earTwitchRight 3s infinite ease-in-out; }
        .neon-glow { box-shadow: 0 0 30px rgba(236, 72, 153, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center space-y-8 max-w-sm w-full">
        <div class="w-32 h-32 mx-auto relative fox-container flex items-center justify-center">
            <div class="ear-l absolute -top-2 left-3 w-8 h-10 bg-gradient-to-b from-[#EC4899] to-[#7C3AED] rounded-tl-full origin-bottom-right rotate-[35deg] flex items-center justify-center">
                <div class="w-4 h-6 bg-[#121420] rounded-tl-full opacity-60"></div>
            </div>
            <div class="ear-r absolute -top-2 right-3 w-8 h-10 bg-gradient-to-b from-[#EC4899] to-[#7C3AED] rounded-tr-full origin-bottom-left -rotate-[35deg] flex items-center justify-center">
                <div class="w-4 h-6 bg-[#121420] rounded-tr-full opacity-60"></div>
            </div>
            <div class="w-28 h-24 bg-gradient-to-tr from-[#7C3AED] via-[#EC4899] to-[#FF007F] rounded-[2.2rem] neon-glow relative flex flex-col items-center justify-center pt-4">
                <div class="flex gap-7">
                    <div class="w-4 h-5 bg-[#121420] rounded-full relative flex items-start justify-start p-0.5"><div class="w-1.5 h-1.5 bg-white rounded-full"></div></div>
                    <div class="w-4 h-5 bg-[#121420] rounded-full relative flex items-start justify-start p-0.5"><div class="w-1.5 h-1.5 bg-white rounded-full"></div></div>
                </div>
                <div class="absolute bottom-7 left-3 w-4 h-2 bg-white/40 rounded-full blur-[1px]"></div>
                <div class="absolute bottom-7 right-3 w-4 h-2 bg-white/40 rounded-full blur-[1px]"></div>
                <div class="mt-2 flex flex-col items-center">
                    <div class="w-2.5 h-1.5 bg-[#121420] rounded-b-full"></div>
                    <div class="text-[#121420] font-black text-xs -mt-1 tracking-tighter">w</div>
                </div>
            </div>
        </div>
        <div class="space-y-1">
            <h1 class="text-4xl font-black tracking-tight text-white uppercase">Toka<span class="text-[#EC4899]">Play</span></h1>
            <p class="text-xs text-slate-500 uppercase tracking-widest font-mono">Real-Time Social Gaming Hub</p>
        </div>
        <div class="w-48 h-1.5 bg-white/5 rounded-full mx-auto overflow-hidden border border-white/5">
            <div class="h-full bg-gradient-to-r from-[#7C3AED] to-[#EC4899] rounded-full w-0 transition-all duration-[2500ms] ease-out" id="loading-progress"></div>
        </div>
    </div>
    <script>
        window.onload = function() {
            document.getElementById("loading-progress").style.width = "100%";
            setTimeout(() => { window.location.href = "register.html"; }, 3000);
        }
    </script>
</body>
</html>
