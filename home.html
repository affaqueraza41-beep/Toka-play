<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokaPlay Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0B0C10; color: white; font-family: sans-serif; }
    </style>
</head>
<body class="pb-24">

    <!-- Header Section -->
    <div class="flex justify-between items-center p-4">
        <h1 class="text-xl font-black">TOKA<span class="text-[#EC4899]">PLAY</span></h1>
        <div class="flex gap-2 bg-[#1C1F32] px-3 py-1 rounded-full text-xs font-bold">
            <span class="text-yellow-400">🟡 999M+</span>
            <span class="text-[#EC4899]">💎 INF+</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="p-4 space-y-4">
        
        <!-- Toka Wedding Sanctuary -->
        <div class="bg-gradient-to-br from-[#1A1C2E] to-[#121420] border border-pink-500/30 p-5 rounded-2xl">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-sm">TOKA WEDDING SANCTUARY</h2>
                    <p class="text-[10px] text-pink-400">Status: Married</p>
                </div>
                <!-- Minimalist Couple Logo -->
                <i class="fa-solid fa-user-group text-3xl text-pink-400"></i>
            </div>
            <div class="mt-4 flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-purple-500 to-pink-500 rounded-full"></div>
                <div>
                    <p class="text-sm font-bold">Aria_22</p>
                    <p class="text-[10px] text-slate-400">Affinity: 154,820</p>
                </div>
            </div>
        </div>

        <!-- Who's the Agent -->
        <div class="h-24 bg-[#1C1F32] rounded-2xl flex items-center justify-between px-6 border border-white/5">
            <div class="font-black text-lg leading-tight">WHO'S THE<br><span class="text-[#EC4899]">AGENT</span></div>
            <!-- Minimalist Agent Logo -->
            <i class="fa-solid fa-user-secret text-4xl text-slate-500"></i>
        </div>

        <!-- Voice Lounge -->
        <div class="h-24 bg-[#1C1F32] rounded-2xl flex items-center justify-between px-6 border border-white/5">
            <div class="font-black text-lg leading-tight text-blue-400">VOICE<br>LOUNGE</div>
            <!-- Minimalist Voice Logo -->
            <i class="fa-solid fa-microphone-lines text-4xl text-blue-400"></i>
        </div>
    </div>

    <!-- Bottom Navigation (3 Buttons Only) -->
    <div class="fixed bottom-0 w-full bg-[#0B0C10] border-t border-white/10 flex justify-around p-4">
        <a href="home.html" class="text-[#EC4899] text-xl"><i class="fa-solid fa-house"></i></a>
        <a href="chat.html" class="text-white text-xl"><i class="fa-solid fa-comment"></i></a>
        <a href="profile.html" class="text-white text-xl"><i class="fa-solid fa-user"></i></a>
    </div>

</body>
</html>
